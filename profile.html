<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Profile | Lucid Links</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030303; color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        .noise-layer {
            position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        #pageBgMedia {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -10; filter: brightness(0.65);
        }

        .card-container {
            max-width: 580px; width: 100%;
            background: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
        }

        .bg-banner {
            width: 100%; height: 190px;
            background-size: cover; background-position: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .avatar-overlap {
            margin-top: -60px; width: 115px; height: 115px;
            border-radius: 9999px; border: 4px solid #0a0a0a;
            position: relative; background: #111;
        }

        .social-pill {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc; transition: all 0.2s ease;
        }
        .social-pill:hover {
            background: #ffffff; color: #000000; transform: translateY(-2px);
        }

        .custom-tab-btn {
            font-size: 11px; font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase; letter-spacing: 0.15em;
            color: #777; padding: 10px 16px;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .custom-tab-btn.active {
            color: #ffffff; border-bottom-color: #ffffff; font-weight: 700;
        }

        .audio-slider {
            -webkit-appearance: none; height: 4px; border-radius: 2px; background: #222; outline: none;
        }
        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #ffffff; cursor: pointer;
        }

        .glow-active {
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.85), 0 0 32px rgba(255, 255, 255, 0.35);
        }
        .effect-chromatic {
            animation: chromaticShift 2.5s infinite alternate ease-in-out;
        }
        @keyframes chromaticShift {
            0% { text-shadow: -2px 0 red, 2px 0 cyan; }
            50% { text-shadow: 2px 0 red, -2px 0 cyan; }
            100% { text-shadow: -1px 0 magenta, 1px 0 green; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative">
    <div class="noise-layer"></div>
    <div id="bgContainer"></div>
    <audio id="bgAudio" loop preload="auto" crossorigin="anonymous"></audio>

    <!-- Autoplay Gate Overlay -->
    <div id="gateOverlay" class="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center cursor-pointer">
        <span class="w-12 h-12 rounded-full border border-white/20 flex items-center justify-center text-white mb-3 animate-pulse">
            <i class="fa-solid fa-volume-high"></i>
        </span>
        <p class="font-oswald text-xl uppercase tracking-[0.3em] text-white">Click anywhere to enter</p>
        <span class="text-[10px] font-mono text-gray-500 uppercase mt-1">Lucid.mp3 Profile Network</span>
    </div>

    <!-- Main Card -->
    <div class="card-container relative my-8">
        <div id="profileBanner" class="bg-banner bg-[#111]">
            <div class="absolute top-3 left-4 text-[10px] font-mono uppercase tracking-widest text-white/80 flex items-center gap-1.5 bg-black/40 px-2.5 py-1 rounded-full backdrop-blur-md border border-white/10">
                <i class="fa-regular fa-calendar"></i>
                <span id="statJoined">Member</span>
            </div>

            <div class="absolute top-3 right-4 flex items-center gap-2">
                <div class="text-[10px] font-mono uppercase tracking-widest text-white/80 flex items-center gap-1.5 bg-black/40 px-2.5 py-1 rounded-full backdrop-blur-md border border-white/10">
                    <i class="fa-regular fa-eye"></i>
                    <span id="statViews">0 Views</span>
                </div>
                <div class="text-[10px] font-mono uppercase tracking-widest text-white/80 flex items-center gap-1 bg-black/40 px-2.5 py-1 rounded-full backdrop-blur-md border border-white/10 font-bold">
                    <i class="fa-solid fa-ranking-star text-yellow-400"></i>
                    <span id="statRank">#1</span>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center px-6 pb-6 text-center">
            <!-- Overlapping Avatar -->
            <div class="avatar-overlap overflow-hidden shadow-2xl">
                <img id="profileAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" onerror="this.onerror=null;this.src='https://cdn.discordapp.com/embed/avatars/0.png';" class="w-full h-full object-cover">
                <span id="discordStatusDot" class="w-4 h-4 bg-gray-600 border-2 border-black rounded-full absolute bottom-1 right-1"></span>
            </div>

            <h1 id="profileUsername" class="font-bold text-2xl tracking-tight text-white mt-3 flex items-center gap-2">Loading...</h1>
            
            <!-- Badges Row -->
            <div id="profileBadgesRow" class="flex items-center justify-center gap-2 mt-1.5 text-sm text-gray-400"></div>

            <span id="profileHandleText" class="text-xs font-mono text-gray-400 mt-2 block"></span>
            <p id="profileTagline" class="text-xs font-bold text-gray-200 uppercase tracking-widest mt-1 hidden"></p>
            <p id="profileSubBio" class="text-xs text-gray-400 font-mono mt-0.5 hidden"></p>

            <div id="profileLocationBox" class="flex items-center gap-1 text-[11px] font-mono text-gray-400 mt-2 hidden">
                <i class="fa-solid fa-location-dot"></i>
                <span id="profileLocationText"></span>
            </div>

            <!-- Social Links Grid -->
            <div id="profileSocialsGrid" class="flex items-center justify-center gap-2.5 mt-4"></div>

            <!-- Discord Presence Dock (Dynamic User Data) -->
            <div class="w-full bg-[#0a0a0a] border border-[#1f1f1f] rounded-2xl p-3.5 mt-6 flex items-center justify-between text-left">
                <div class="flex items-center gap-3 truncate">
                    <div class="w-11 h-11 rounded-full bg-[#181818] overflow-hidden border border-[#262626] flex-shrink-0">
                        <img id="dockAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" onerror="this.onerror=null;this.src='https://cdn.discordapp.com/embed/avatars/0.png';" class="w-full h-full object-cover">
                    </div>
                    <div class="truncate">
                        <div class="flex items-center gap-1.5">
                            <span id="dockUsername" class="text-xs font-bold text-white truncate font-sans">Discord User</span>
                            <span class="text-[9px] border border-[#333] px-1 py-0.5 rounded text-gray-400 font-mono">STATUS</span>
                        </div>
                        <p id="dockActivity" class="text-[10px] font-mono text-gray-500 truncate mt-0.5">Offline on Discord</p>
                    </div>
                </div>
                <button onclick="copyDiscordTag()" class="border border-[#333] hover:border-white text-[10px] font-mono uppercase px-3 py-1.5 rounded-lg text-gray-300 hover:text-white transition flex-shrink-0 ml-2">
                    Add Friend
                </button>
            </div>

            <!-- Music Player Dock (Only Displays When User Has Audio Configured) -->
            <div id="audioPlayerCard" class="w-full bg-[#0a0a0a] border border-[#1f1f1f] rounded-2xl p-4 mt-3 flex flex-col gap-3 hidden">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 truncate">
                        <div class="w-12 h-12 rounded-xl bg-[#181818] overflow-hidden border border-[#222] flex-shrink-0">
                            <img id="trackCover" src="https://cdn.discordapp.com/embed/avatars/0.png" onerror="this.onerror=null;this.src='https://cdn.discordapp.com/embed/avatars/0.png';" class="w-full h-full object-cover">
                        </div>
                        <div class="truncate text-left">
                            <h4 id="trackTitle" class="text-xs font-bold text-white truncate">Audio Track</h4>
                            <p id="trackArtist" class="text-[10px] font-mono text-gray-500 truncate">Artist</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <i id="volumeIcon" class="fa-solid fa-volume-high text-xs text-gray-400"></i>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" class="audio-slider w-16 accent-white">
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="togglePlayAudio()" class="text-white hover:text-gray-300 transition text-sm">
                        <i id="playIcon" class="fa-solid fa-play"></i>
                    </button>
                    <input type="range" id="seekSlider" min="0" max="100" value="0" class="audio-slider flex-1 accent-white">
                    <span id="timeDisplay" class="text-[9px] font-mono text-gray-500">0:00 / 0:00</span>
                </div>
            </div>

            <!-- Dynamic Tab Headers Row -->
            <div id="tabHeadersRow" class="w-full border-b border-[#222] mt-6 flex justify-around overflow-x-auto"></div>

            <!-- Dynamic Tab Bodies Container -->
            <div id="tabBodiesContainer" class="w-full pt-4 text-xs font-mono text-gray-400 text-left"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let targetHandle = urlParams.get('handle') || urlParams.get('username') || window.location.pathname.split('/').pop().replace('@', '');
        if (!targetHandle) targetHandle = 'guest';

        let audioEl = document.getElementById('bgAudio');
        let profileUserId = null;
        let PROFILE_DATA = null;

        async function sendAnalyticsEvent(type) {
            const isMobile = /Mobi|Android/i.test(navigator.userAgent);
            let ref = 'direct';
            if (document.referrer.includes('discord')) ref = 'discord';
            else if (document.referrer.includes('tiktok')) ref = 'tiktok';

            try {
                await fetch('/api/master', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'track_event',
                        handle: targetHandle,
                        userId: profileUserId,
                        type,
                        device: isMobile ? 'mobile' : 'desktop',
                        referrer: ref
                    })
                });
            } catch(e) {}
        }

        async function loadProfile() {
            try {
                const res = await fetch(`/api/master?action=profile&username=${encodeURIComponent(targetHandle)}`);
                if (!res.ok) {
                    document.getElementById('profileUsername').textContent = `@${targetHandle} is unclaimed`;
                    document.getElementById('gateOverlay').style.display = 'none';
                    return;
                }

                const d = await res.json();
                PROFILE_DATA = d;
                profileUserId = d.userId;

                const displayName = d.username || targetHandle;
                document.title = `@${displayName} | Bio`;
                document.getElementById('profileUsername').textContent = displayName;
                document.getElementById('profileHandleText').textContent = `@${targetHandle}`;

                // Dynamic Tagline & Sub-bio (Hides completely if empty, no placeholders)
                const taglineEl = document.getElementById('profileTagline');
                if (d.description && d.description.trim()) {
                    taglineEl.textContent = d.description.trim();
                    taglineEl.classList.remove('hidden');
                } else {
                    taglineEl.classList.add('hidden');
                }

                const subBioEl = document.getElementById('profileSubBio');
                if (d.subBio && d.subBio.trim()) {
                    subBioEl.textContent = d.subBio.trim();
                    subBioEl.classList.remove('hidden');
                } else {
                    subBioEl.classList.add('hidden');
                }

                const locBox = document.getElementById('profileLocationBox');
                if (d.location && d.location.trim()) {
                    document.getElementById('profileLocationText').textContent = d.location.trim();
                    locBox.classList.remove('hidden');
                } else {
                    locBox.classList.add('hidden');
                }

                if (d.joinedDate && d.joinedDate.trim()) {
                    document.getElementById('statJoined').textContent = d.joinedDate.trim();
                }

                // Global Custom Cursor Injection
                if (d.cursor && d.cursor.trim()) {
                    let cursorStyle = document.getElementById('globalCursorStyle');
                    if (!cursorStyle) {
                        cursorStyle = document.createElement('style');
                        cursorStyle.id = 'globalCursorStyle';
                        document.head.appendChild(cursorStyle);
                    }
                    cursorStyle.innerHTML = `* , *:hover, a, button, input, div, span, p, h1, h2, h3, h4 { cursor: url('${d.cursor.trim()}'), auto !important; }`;
                }

                // Avatars & Presence Defaults
                const pfp = (d.avatar && d.avatar.startsWith('http')) ? d.avatar : 'https://cdn.discordapp.com/embed/avatars/0.png';
                document.getElementById('profileAvatar').src = pfp;
                document.getElementById('dockAvatar').src = pfp;
                document.getElementById('dockUsername').textContent = d.discordTag || displayName;

                // Background Video or Image
                const bgUrl = d.background || '';
                const bgBox = document.getElementById('bgContainer');
                if (bgUrl.endsWith('.mp4') || bgUrl.endsWith('.webm')) {
                    bgBox.innerHTML = `<video id="pageBgMedia" autoplay loop muted playsinline src="${bgUrl}"></video>`;
                } else if (bgUrl) {
                    bgBox.innerHTML = `<div id="pageBgMedia" style="background-image: url('${bgUrl}'); background-size: cover; background-position: center;"></div>`;
                    document.getElementById('profileBanner').style.backgroundImage = `url('${bgUrl}')`;
                }

                // Audio Player: Only renders if user uploaded a song
                if (d.audio && d.audio.trim()) {
                    audioEl.src = d.audio.trim();
                    document.getElementById('trackTitle').textContent = d.trackTitle || "Audio Track";
                    document.getElementById('trackArtist').textContent = d.trackArtist || displayName;
                    document.getElementById('trackCover').src = (d.trackCover && d.trackCover.startsWith('http')) ? d.trackCover : pfp;
                    document.getElementById('audioPlayerCard').classList.remove('hidden');
                } else {
                    document.getElementById('audioPlayerCard').classList.add('hidden');
                    document.getElementById('gateOverlay').style.display = 'none';
                }

                // Shaders & Glow
                if (d.glowUsername) document.getElementById('profileUsername').classList.add('glow-active');
                if (d.userEffect === 'chromatic') document.getElementById('profileUsername').classList.add('effect-chromatic');

                // Custom Badges
                const badgesRow = document.getElementById('profileBadgesRow');
                badgesRow.innerHTML = '';
                const iconMap = {
                    crown: 'fa-solid fa-crown text-yellow-400',
                    star: 'fa-solid fa-star text-purple-400',
                    heart: 'fa-solid fa-heart text-pink-500',
                    paw: 'fa-solid fa-paw text-gray-300',
                    skull: 'fa-solid fa-skull text-gray-200',
                    sparkles: 'fa-solid fa-wand-magic-sparkles text-cyan-400',
                    fire: 'fa-solid fa-fire text-red-500',
                    gamepad: 'fa-solid fa-gamepad text-indigo-400'
                };
                if (Array.isArray(d.iconBadges) && d.iconBadges.length > 0) {
                    d.iconBadges.forEach(b => {
                        badgesRow.innerHTML += `<i class="${iconMap[b] || 'fa-solid fa-tag'} text-xs"></i>`;
                    });
                }

                // Social Links
                const s = d.socials || {};
                const sGrid = document.getElementById('profileSocialsGrid');
                sGrid.innerHTML = '';
                const icons = {
                    spotify: 'fa-brands fa-spotify', instagram: 'fa-brands fa-instagram',
                    youtube: 'fa-brands fa-youtube', discord: 'fa-brands fa-discord',
                    tiktok: 'fa-brands fa-tiktok', soundcloud: 'fa-brands fa-soundcloud',
                    custom: 'fa-solid fa-link'
                };
                for (const [key, link] of Object.entries(s)) {
                    if (link) {
                        sGrid.innerHTML += `
                            <a href="${link}" target="_blank" onclick="sendAnalyticsEvent('click')" class="social-pill">
                                <i class="${icons[key] || 'fa-solid fa-link'}"></i>
                            </a>
                        `;
                    }
                }

                // Dynamic Tabs
                const customTabs = Array.isArray(d.customTabs) && d.customTabs.length > 0 
                    ? d.customTabs 
                    : [
                        { title: 'Main', content: d.description || 'Welcome to my official profile page.' }
                    ];

                renderCustomTabs(customTabs);
                sendAnalyticsEvent('view');

                if (d.userId) connectLanyard(d.userId);
            } catch (err) {
                console.error("Profile load error:", err);
            }
        }

        function renderCustomTabs(tabs) {
            const headersRow = document.getElementById('tabHeadersRow');
            const bodiesCol = document.getElementById('tabBodiesContainer');
            headersRow.innerHTML = '';
            bodiesCol.innerHTML = '';

            tabs.forEach((tab, i) => {
                const btn = document.createElement('button');
                btn.className = `custom-tab-btn ${i === 0 ? 'active' : ''}`;
                btn.textContent = tab.title;
                btn.onclick = () => {
                    document.querySelectorAll('.custom-tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.tab-content-panel').forEach(p => p.classList.add('hidden'));
                    document.getElementById(`tabPanel-${i}`).classList.remove('hidden');
                };
                headersRow.appendChild(btn);

                const panel = document.createElement('div');
                panel.id = `tabPanel-${i}`;
                panel.className = `tab-content-panel whitespace-pre-line ${i === 0 ? '' : 'hidden'}`;
                panel.textContent = tab.content;
                bodiesCol.appendChild(panel);
            });
        }

        function connectLanyard(uid) {
            try {
                const ws = new WebSocket('wss://api.lanyard.rest/socket');
                ws.onopen = () => ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: uid } }));
                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE') {
                        const data = msg.d;
                        const statusColors = { online: 'bg-green-500', idle: 'bg-yellow-500', dnd: 'bg-red-500', offline: 'bg-gray-600' };
                        document.getElementById('discordStatusDot').className = `w-4 h-4 border-2 border-black rounded-full absolute bottom-1 right-1 ${statusColors[data.discord_status] || 'bg-gray-600'}`;

                        if (data.discord_user) {
                            const name = data.discord_user.global_name || data.discord_user.username;
                            document.getElementById('dockUsername').textContent = name;
                            if (data.discord_user.avatar) {
                                document.getElementById('dockAvatar').src = `https://cdn.discordapp.com/avatars/${data.discord_user.id}/${data.discord_user.avatar}.png`;
                            }
                        }

                        if (data.listening_to_spotify && data.spotify) {
                            document.getElementById('dockActivity').textContent = `Listening to ${data.spotify.song} by ${data.spotify.artist}`;
                        } else if (data.activities && data.activities[0]) {
                            document.getElementById('dockActivity').textContent = data.activities[0].name;
                        } else {
                            document.getElementById('dockActivity').textContent = data.discord_status ? data.discord_status.toUpperCase() : 'OFFLINE';
                        }
                    }
                };
            } catch (e) {}
        }

        function togglePlayAudio() {
            const icon = document.getElementById('playIcon');
            if (!audioEl.src) return;
            if (audioEl.paused) {
                audioEl.play().then(() => {
                    icon.className = 'fa-solid fa-pause';
                }).catch(() => {
                    alert("Audio playback failed. Please verify that the audio file URL is directly accessible.");
                });
            } else {
                audioEl.pause();
                icon.className = 'fa-solid fa-play';
            }
        }

        audioEl.addEventListener('loadedmetadata', () => {
            if (audioEl.duration && !isNaN(audioEl.duration)) {
                const formatTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
                document.getElementById('timeDisplay').textContent = `0:00 / ${formatTime(audioEl.duration)}`;
            }
        });

        audioEl.addEventListener('timeupdate', () => {
            if (audioEl.duration && !isNaN(audioEl.duration)) {
                const pct = (audioEl.currentTime / audioEl.duration) * 100;
                document.getElementById('seekSlider').value = pct;
                const formatTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
                document.getElementById('timeDisplay').textContent = `${formatTime(audioEl.currentTime)} / ${formatTime(audioEl.duration)}`;
            }
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            audioEl.volume = e.target.value;
            const vIcon = document.getElementById('volumeIcon');
            if (audioEl.volume === 0) vIcon.className = "fa-solid fa-volume-xmark text-xs text-gray-400";
            else if (audioEl.volume < 0.5) vIcon.className = "fa-solid fa-volume-low text-xs text-gray-400";
            else vIcon.className = "fa-solid fa-volume-high text-xs text-gray-400";
        });

        document.getElementById('seekSlider').addEventListener('input', (e) => {
            if (audioEl.duration && !isNaN(audioEl.duration)) {
                audioEl.currentTime = (e.target.value / 100) * audioEl.duration;
            }
        });

        function copyDiscordTag() {
            const tag = (PROFILE_DATA && (PROFILE_DATA.discordTag || PROFILE_DATA.username)) || targetHandle;
            navigator.clipboard.writeText(tag).then(() => {
                alert(`Copied Discord username: @${tag}`);
            });
        }

        document.getElementById('gateOverlay').addEventListener('click', function() {
            this.style.display = 'none';
            if (audioEl.src) {
                audioEl.play().then(() => {
                    document.getElementById('playIcon').className = 'fa-solid fa-pause';
                }).catch(() => {});
            }
        });

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
